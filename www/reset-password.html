<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cropbook - Reimposta Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 { color: #2E7D32; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        .info { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Reimposta Password</h2>
        
        <div class="form-group">
            <label for="newPassword">Nuova Password</label>
            <input type="password" id="newPassword" placeholder="Minimo 6 caratteri" minlength="6">
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">Conferma Password</label>
            <input type="password" id="confirmPassword" placeholder="Reinserisci la password" minlength="6">
        </div>
        
        <button onclick="resetPassword()">Reimposta Password</button>
        
        <div id="message" class="message"></div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #4CAF50; text-decoration: none;">← Torna al Login</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        
        async function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            if (!token) {
                showMessage('Token mancante o non valido', 'error');
                return;
            }
            
            if (!newPassword || !confirmPassword) {
                showMessage('Inserisci entrambi i campi', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('La password deve avere almeno 6 caratteri', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Le password non coincidono', 'error');
                return;
            }
            
            showMessage('Aggiornamento in corso...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('✅ Password aggiornata con successo! Reindirizzamento al login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showMessage('Errore: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('Errore di connessione: ' + error.message, 'error');
            }
        }
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
